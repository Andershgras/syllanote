name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_NOLOGO: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore Syllanote/Syllanote.sln

      - name: Build
        run: dotnet build Syllanote/Syllanote.sln -c Debug --no-restore -m:1

      - name: Test
        run: dotnet test Syllanote/tests/Syllanote.Tests/Syllanote.Tests.csproj -c Debug --no-build --no-restore -m:1
